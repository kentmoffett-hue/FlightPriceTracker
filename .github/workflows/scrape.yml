name: Daily Flight Price Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Automatically kills the job if it hangs past 5 minutes

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run flight tracker script
        run: python tracker.py

      - name: Save updated database to repository
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add flight_tracker.db
          git commit -m "Auto-update flight prices [skip ci]" || exit 0
          git push
