name: Flight Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push changes back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python tracker.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_tracker.db
          # Only commit and push if the database actually changed
          git status --porcelain
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Automated flight data update [skip ci]"
            git push
          else
            echo "No changes in database to commit."
          fi
