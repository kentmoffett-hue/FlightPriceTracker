name: Daily Flight Price Scraper

on:
  schedule:
    # Runs every day at 00:00 UTC (8:00 PM EST)
    - cron: '0 0 * * *'
  # Allows you to manually trigger the script anytime from the GitHub interface
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flight tracker script
        run: python tracker.py

      - name: Save updated database to repository
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Flight_Tracker.db
          git commit -m "Auto-update flight prices [skip ci]" || exit 0
          git push
