name: Daily Flight Price Scraper

on:
  schedule:
    # Runs every 2 days at midnight UTC to stay within 100 free monthly API calls
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flight tracker script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python tracker.py

      - name: Save updated database to repository
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add flight_tracker.db
          git commit -m "Auto-update flight prices [skip ci]" || exit 0
          git push
