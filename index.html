<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vacation Flight Price Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: sans-serif; padding: 2rem; background: #f9f9f9;">

  <h2>1-Year Flight Price Trend (Toronto to Targets)</h2>
  <div style="width: 80%; margin: auto; background: white; padding: 20px; border-radius: 8px;">
    <canvas id="priceChart"></canvas>
  </div>

  <script>
    const colors = [
      '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', 
      '#f1c40f', '#e67e22', '#1abc9c', '#34495e', '#d35400'
    ];

    async function loadChartData() {
      try {
        const response = await fetch('./data.json');
        const dataFromDb = await response.json();

        if (!dataFromDb || dataFromDb.length === 0) {
          console.error("No flight data found in data.json");
          return;
        }

        const labels = [...new Set(dataFromDb.map(row => row.date))].sort();
        const cities = [...new Set(dataFromDb.map(row => row.city))];

        const datasets = cities.map((city, index) => {
          return {
            label: city,
            data: labels.map(date => {
              const entry = dataFromDb.find(item => item.city === city && item.date === date);
              return entry ? entry.price : null;
            }),
            borderColor: colors[index % colors.length],
            borderWidth: 2,
            tension: 0.2,
            spanGaps: true
          };
        });

        const ctx = document.getElementById('priceChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            scales: {
              x: { title: { display: true, text: 'Date Searched' } },
              y: { title: { display: true, text: 'Price (CAD)' } }
            }
          }
        });
      } catch (error) {
        console.error("Error loading chart data:", error);
      }
    }

    loadChartData();
  </script>
</body>
</html>
